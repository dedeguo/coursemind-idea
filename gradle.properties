group = org.jetbrains.plugins.template
version = 2.6.0

pluginRepositoryUrl = https://github.com/JetBrains/intellij-platform-plugin-template

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true

systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.https.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|mirrors.cloud.tencent.com

pluginGroup=top.chende.coursemind
pluginVersion=0.1.0

# IC：IntelliJ IDEA Community 平台
platformType=IC
platformVersion=2023.3

# 最低支持 IDEA 2023.3
pluginSinceBuild=233

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true