# 插件元数据（发布 ID 固定为 top.chende.coursemind）
group=top.chende.coursemind
version=0.3.0
pluginGroup=top.chende.coursemind
pluginVersion=0.3.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true

# 构建剖面：release＝发布基线（IDEA Ultimate 2025.1.3 + JDK 21，输出 Java 17 字节码），默认值
# 本地调试用 -PcourseMindProfile=local 或 gradle.properties.local 覆盖，见 gradle.properties.local.example
courseMindProfile=release
platformType=IU
platformVersion=2025.1.3
pluginSinceBuild=251

# 平台获取方式：true=下载安装包（默认），false=使用 IntelliJ Maven 归档
platformUseInstaller=true

# javaVersion 不在此写死：release 剖面默认 21，local 剖面默认 25，可用 -PjavaVersion=... 覆盖

# 本机代理（个人设置，课堂/CI 环境无此代理时构建会失败，见 docs/implementation/M0-Baseline.md D-06）
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.https.nonProxyHosts=localhost|127.0.0.1|maven.aliyun.com|mirrors.cloud.tencent.com

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
