name: Build and Test

on:
  push:
    branches: [main]
    # 只有推送版本 tag（如 v0.3.0）才打包；普通提交与 PR 仅做编译与测试
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 打包只在版本 tag 或手动触发时执行，避免每次提交都产出 ZIP
      PACKAGE_PLUGIN: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      # 仓库目前保留了本机代理，GitHub runner 无法访问该地址。
      # 只调整 CI 检出副本，不修改开发者的本地配置。
      # 长期方案（代理改为可选、由 gradle.properties.local 覆盖）见 docs/implementation/M0-Baseline.md 的 D-06。
      - name: Remove local proxy settings for CI
        run: sed -i '/^systemProp\.https\./d' gradle.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      # check 包含测试及其编译依赖。
      # 使用虚拟显示器运行 IntelliJ 平台测试。
      # 显式锁定发布剖面：local 剖面需要本机已安装的 IDEA，在 runner 上无法构建。
      - name: Compile and test
        run: xvfb-run --auto-servernum ./gradlew check -PcourseMindProfile=release --no-daemon --stacktrace

      # 仅版本 tag 或手动触发时打包，命中构建缓存后开销很小。
      - name: Build plugin package
        if: env.PACKAGE_PLUGIN == 'true'
        run: xvfb-run --auto-servernum ./gradlew buildPlugin -PcourseMindProfile=release --no-daemon --stacktrace

      # artifact 名使用 tag 名，约定 tag 形如 v0.3.0（不要含 /，否则 artifact 上传会失败）
      - name: Upload plugin ZIP
        if: env.PACKAGE_PLUGIN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coursemind-plugin-${{ github.ref_name }}
          path: build/distributions/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            build/reports/tests/
            build/test-results/
          if-no-files-found: ignore
          retention-days: 14
